name: One-time old test image cleanup
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove only superseded GHCR test tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          base = 'https://api.github.com/users/roninriddle/packages/container/iptv-sniffer-web/versions'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          def call(url, method='GET'):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers, method=method), timeout=30) as response:
                  body = response.read()
                  return json.loads(body) if body else None
          def versions():
              result = []
              for page in range(1, 101):
                  rows = call(base + '?per_page=100&page=' + str(page))
                  result.extend(rows)
                  if len(rows) < 100:
                      return result
              raise RuntimeError('Pagination limit exceeded')
          old = {'1.3.4-test', '1.3.5-test', '1.3.6-test'}
          rows = versions()
          assert any('1.3.7-test' in r['metadata']['container']['tags'] for r in rows), 'New test release is missing'
          protected = {r['id'] for r in rows if set(r['metadata']['container']['tags']) - old}
          targets = [r for r in rows if set(r['metadata']['container']['tags']) & old]
          for r in targets:
              assert set(r['metadata']['container']['tags']) <= old, 'Shared version contains a protected tag'
          for r in targets:
              print('Deleting', r['id'], r['metadata']['container']['tags'])
              call(base + '/' + str(r['id']), 'DELETE')
          remaining = versions()
          assert not any(set(r['metadata']['container']['tags']) & old for r in remaining)
          assert protected <= {r['id'] for r in remaining}
          print('Verified: old test versions removed; all other tagged versions retained')
          PY
