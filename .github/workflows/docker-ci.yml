name: Docker CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install --require-hashes -r requirements-dev.lock
      - name: Validate source and release identity
        run: |
          python tools/check_release.py
          python -m compileall -q app.py config.py models.py utils.py services tools
          node --check static/app.js
          node --test tests/settings-queue.test.cjs
      - name: Run regressions
        run: pytest -q --junitxml=pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ github.sha }}
          path: pytest.xml
  image:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: iptv-sniffer-web:ci-${{ github.sha }}-${{ matrix.arch }}
      - name: Check image runtime
        env:
          TEST_IMAGE: iptv-sniffer-web:ci-${{ github.sha }}-${{ matrix.arch }}
        run: docker run --rm --network none --entrypoint python "$TEST_IMAGE" -c 'import app; assert app.APP_VERSION'
      - name: Produce SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: iptv-sniffer-web:ci-${{ github.sha }}-${{ matrix.arch }}
          format: cyclonedx
          output: sbom.json
      - name: Block fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: iptv-sniffer-web:ci-${{ github.sha }}-${{ matrix.arch }}
          format: json
          output: vulnerabilities.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-evidence-${{ matrix.arch }}-${{ github.sha }}
          path: |
            sbom.json
            vulnerabilities.json
